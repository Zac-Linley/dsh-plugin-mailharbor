name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No registry-url on purpose: setup-node would write an .npmrc whose
      # _authToken=${NODE_AUTH_TOKEN} expands to an empty string, and npm then
      # treats auth as already configured and never starts the OIDC exchange
      # (actions/setup-node#1551). registry.npmjs.org is npm's default anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; upgrade the CLI only.
      - name: Upgrade npm CLI for trusted publishing
        run: |
          npm install -g npm@11
          npm --version
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run release:ci
          commit-message: 'chore: release'
          pr-title: 'chore: release'
        env:
          # Trusted publishing (OIDC): no NPM_TOKEN, no NODE_AUTH_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
