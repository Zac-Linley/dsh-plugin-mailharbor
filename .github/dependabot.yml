version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 6/7 is outside typescript-eslint's supported range today.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # ESLint 10 requires @eslint/js 10 and a flat-config migration.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Keep the type definitions on the Node 24 baseline DSH ships.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
