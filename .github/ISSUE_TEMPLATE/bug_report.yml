name: Bug report
description: Report something that does not work in MailHarbor
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove real email addresses, subjects and attachment names
        from logs before posting.
  - type: input
    id: version
    attributes:
      label: MailHarbor version
      description: From package.json or the DSH settings page.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version and OS
      placeholder: DSH 0.2.2-rc.1, macOS 15.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open MailHarbor
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
      description: Paste the error text or the backup log (redact addresses).
    validations:
      required: true
